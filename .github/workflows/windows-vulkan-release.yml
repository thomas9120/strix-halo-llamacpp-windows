name: Windows Vulkan release

on:
  workflow_dispatch:
    inputs:
      llama_ref:
        description: llama.cpp branch, tag, or commit to build
        required: true
        default: strix-halo-vulkan
      release_tag:
        description: Release tag to create or update in this repository
        required: true
      prerelease:
        description: Mark the release as a prerelease
        type: boolean
        default: false

permissions:
  contents: write

env:
  LLAMA_REPO: Nathanw1014/llama.cpp
  VULKAN_VERSION: 1.4.350.0

jobs:
  build-release:
    runs-on: windows-2025
    timeout-minutes: 90

    steps:
      - name: Check out packaging repository
        uses: actions/checkout@v4

      - name: Check out llama.cpp fork
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LLAMA_REPO }}
          ref: ${{ inputs.llama_ref }}
          path: llama.cpp
          fetch-depth: 1

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa # v1.6.0
        with:
          vulkan_version: ${{ env.VULKAN_VERSION }}
          cache: true
          stripdown: true
          github_token: ${{ github.token }}

      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S llama.cpp -B build -A x64 `
            -DGGML_VULKAN=ON `
            -DGGML_NATIVE=OFF `
            -DLLAMA_CURL=OFF `
            -DLLAMA_OPENSSL=OFF `
            "-DVulkan_INCLUDE_DIR=$env:VULKAN_SDK\Include" `
            "-DVulkan_LIBRARY=$env:VULKAN_SDK\Lib\vulkan-1.lib" `
            "-DVulkan_GLSLC_EXECUTABLE=$env:VULKAN_SDK\Bin\glslc.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

          cmake --build build --config Release `
            --target llama-server llama-cli llama-bench --parallel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Package ZIP
        id: package
        shell: pwsh
        run: |
          $bin = Join-Path $PWD "build\bin\Release"
          foreach ($file in @("llama-server.exe", "llama-cli.exe", "llama-bench.exe")) {
            if (-not (Test-Path (Join-Path $bin $file))) {
              throw "Expected build output is missing: $file"
            }
          }

          & (Join-Path $bin "llama-cli.exe") --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

          $sha = git -C llama.cpp rev-parse HEAD
          $short = $sha.Substring(0, 7)
          $dist = Join-Path $PWD "dist\llama.cpp-windows-vulkan-x64"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item (Join-Path $bin "*.exe"), (Join-Path $bin "*.dll") -Destination $dist
          Copy-Item "llama.cpp\LICENSE" -Destination $dist
          @(
            "Source: https://github.com/$env:LLAMA_REPO"
            "Requested ref: $env:LLAMA_REF"
            "Commit: $sha"
            "Vulkan SDK: $env:VULKAN_VERSION"
          ) | Set-Content (Join-Path $dist "BUILD_INFO.txt")

          $zip = Join-Path $PWD "llama.cpp-windows-vulkan-x64.zip"
          Compress-Archive -Path "$dist\*" -DestinationPath $zip -CompressionLevel Optimal
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "short=$short" >> $env:GITHUB_OUTPUT
        env:
          LLAMA_REF: ${{ inputs.llama_ref }}

      - name: Create or update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          ZIP: ${{ steps.package.outputs.zip }}
          LLAMA_SHA: ${{ steps.package.outputs.sha }}
          LLAMA_SHORT: ${{ steps.package.outputs.short }}
          LLAMA_REF: ${{ inputs.llama_ref }}
        run: |
          @"
          Windows x64 Vulkan build of [$env:LLAMA_REPO@$env:LLAMA_REF](https://github.com/$env:LLAMA_REPO/commit/$env:LLAMA_SHA) ($env:LLAMA_SHORT).

          Built with MSVC and Vulkan SDK $env:VULKAN_VERSION. This GitHub-hosted runner can compile the Vulkan backend but cannot test it on Strix Halo hardware.
          "@ | Set-Content release-notes.md

          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $env:ZIP --clobber
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            gh release edit $env:RELEASE_TAG --notes-file release-notes.md
          } else {
            $arguments = @(
              "release", "create", $env:RELEASE_TAG, $env:ZIP,
              "--target", $env:GITHUB_SHA,
              "--title", $env:RELEASE_TAG,
              "--notes-file", "release-notes.md"
            )
            if ($env:PRERELEASE -eq "true") { $arguments += "--prerelease" }
            & gh @arguments
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
